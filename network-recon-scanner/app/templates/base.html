<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Network Recon Scanner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <h1>Network Recon Scanner</h1>
    <p>Python + Nmap, for networks you own or are allowed to test.</p>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Educational project. Scan only with authorisation.</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
